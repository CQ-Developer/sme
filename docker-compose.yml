services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  gateway:
    build: .
    environment:
      DATABASE_URL: postgres://sme:${POSTGRES_PASSWORD:?必须显式提供}@postgres/sme
      VALKEY_URL: redis://valkey:6379
      SME_HMAC_KEY: ${SME_HMAC_KEY:?必须显式提供}
    depends_on:
      postgres: {condition: service_healthy}
      valkey:   {condition: service_healthy}

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: sme
      POSTGRES_DB: sme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须显式提供}
    volumes: [pgdata:/var/lib/postgresql]   # PG 18+ convention: data lives in <mount>/18/docker, enabling pg_upgrade --link
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme -d sme"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.2-alpine
    # ↓ These lines implement "no message ever hits disk" on the deployment side; they are not optional (docs/INFRA.md §5)
    command: >
      valkey-server --save "" --appendonly no
      --dir /data --maxmemory 1gb --maxmemory-policy noeviction
    tmpfs: [/data]        # Data directory in memory: even a misconfiguration can only write to RAM
    # Note: valkey mounts no persistent volume
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
  caddy_data: {}
