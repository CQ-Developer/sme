name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: 不变式门禁（I1 / I2 / Valkey 禁持久化）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 准备 Python 依赖（PyYAML）
        run: python3 -c 'import yaml' || python3 -m pip install pyyaml
      - name: 运行门禁与注入自检
        run: python3 scripts/ci/run_gates.py

  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: sme
          POSTGRES_PASSWORD: sme
          POSTGRES_DB: sme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sme -d sme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sme:sme@localhost:5432/sme
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
