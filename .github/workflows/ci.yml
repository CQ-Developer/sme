name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: 不变式门禁（I1 / I2 / Valkey 禁持久化）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Python 依赖（PyYAML）
        run: python3 -c 'import yaml' || python3 -m pip install pyyaml
      - name: 运行门禁与注入自检
        run: python3 scripts/ci/run_gates.py

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
