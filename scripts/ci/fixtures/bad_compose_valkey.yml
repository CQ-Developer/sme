# Valkey persistence counter-example: persistent volume + AOF + no tmpfs; the gate must report every one of them.
services:
  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: valkey-server --save 900 1 --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    volumes: [/var/lib/valkey]
