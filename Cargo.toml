[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
vodozemac = "0.11.1"
zeroize = { version = "1", features = ["alloc"] }
